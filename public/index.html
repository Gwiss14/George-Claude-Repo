<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Workout Tracker</h1>
    <span id="status" class="status" data-state="connecting"><span class="dot"></span><span class="label">Connecting…</span></span>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="rest" class="rest" hidden>
    <div>
      <div class="rest-label">Rest</div>
      <div id="rest-time" class="rest-time">1:30</div>
    </div>
    <div class="rest-actions">
      <button type="button" data-rest="-15">−15s</button>
      <button type="button" data-rest="15">+15s</button>
      <button type="button" data-rest="skip">Skip</button>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <datalist id="exercise-names"></datalist>
  <script src="app.js"></script>
</body>
</html>
