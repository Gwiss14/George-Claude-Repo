<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2a5e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Roof Rumble" />
  <meta name="format-detection" content="telephone=no" />
  <title>Roof Rumble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <div id="stick-base"><div id="stick-knob"></div></div>
  <div id="pops"></div>

  <!-- title -->
  <section id="title" class="screen">
    <h1>ROOF<br />RUMBLE</h1>
    <p class="sub" id="title-best">Hold the roof for 5:00</p>
    <button id="play-btn" class="big">PLAY</button>
    <button id="shop-btn" class="small">UPGRADES <span class="coin"></span><span id="title-bank">0</span></button>
    <p class="howto">Drag anywhere to move. Juno punches on her own.</p>
    <p id="install" class="howto" hidden>Make it an app: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
  </section>

  <!-- in-run HUD -->
  <section id="hud" hidden>
    <div id="xp"><div id="xp-fill"></div><span id="level">LV 1</span></div>
    <div id="timer">5:00</div>
    <div id="hp"><div id="hp-fill"></div></div>
    <div id="tally"><span class="ko">KO</span> <span id="kills">0</span> <span class="coin"></span><span id="run-coins">0</span></div>
    <button id="pause-btn" aria-label="Pause">II</button>
    <div id="banner"></div>
  </section>

  <section id="levelup" class="screen dim" hidden>
    <h2 id="levelup-title">LEVEL UP!</h2>
    <p class="sub">Pick one</p>
    <div id="cards"></div>
  </section>

  <section id="paused" class="screen dim" hidden>
    <h2>PAUSED</h2>
    <button id="resume-btn" class="big">RESUME</button>
    <button id="quit-btn" class="small">GIVE UP</button>
  </section>

  <section id="results" class="screen dim" hidden>
    <h2 id="results-title">KNOCKED OUT</h2>
    <div class="stats">
      <div><span>Time</span><b id="res-time">0:00</b></div>
      <div><span>KOs</span><b id="res-kills">0</b></div>
      <div><span>Level</span><b id="res-level">1</b></div>
      <div><span>Coins</span><b id="res-coins">+0</b></div>
    </div>
    <p class="sub" id="res-best"></p>
    <button id="again-btn" class="big">PLAY AGAIN</button>
    <button id="end-shop-btn" class="small">UPGRADES</button>
  </section>

  <section id="shop" class="screen dim" hidden>
    <h2>UPGRADES</h2>
    <p class="sub">Kept forever. You have <span class="coin"></span><b id="shop-bank">0</b></p>
    <div id="shop-list"></div>
    <button id="shop-close" class="small">DONE</button>
  </section>

  <div id="debug"></div>
  <script type="module" src="/src/survivor/main.js"></script>
</body>
</html>
