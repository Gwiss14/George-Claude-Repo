<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2a5e" />
  <title>Tank Roof Scrap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="hp"><span class="name">JUNO</span><div class="bar"><div id="hp-fill"></div></div><span id="hp-text">100</span></div>
    <div id="wave">Get ready</div>
    <button id="restart-btn" aria-label="Restart">↻</button>
    <div id="boss"><span class="name">GRUDGE</span><div class="bar"><div id="boss-fill"></div></div></div>
    <div id="banner"></div>
    <div id="hint" class="desktop-only">WASD / arrows move · J or Space attack (press again to combo) · R restart · ` debug</div>
  </div>

  <div id="touch-zone"></div>
  <div id="stick-base"><div id="stick-knob"></div></div>
  <button id="attack-btn" aria-label="Attack">HIT</button>

  <div id="end">
    <div class="card">
      <h1 id="end-title">Knocked out</h1>
      <p id="end-sub"></p>
      <button id="end-restart">Fight again</button>
    </div>
  </div>

  <div id="debug"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
