<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2a5e" />
  <title>Rooftop Shootout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div id="hp"><span class="name">JUNO</span><div class="bar"><div id="hp-fill"></div></div><span id="hp-text">100</span></div>
    <div id="wave">Get ready</div>
    <div id="purse"><span class="coin-icon"></span><span id="coin-count">0</span>
      <span id="weapon-chip"><span id="weapon-name"></span><span id="weapon-pips"></span></span></div>
    <div id="pad-prompt"></div>
    <div id="pops"></div>
    <button id="restart-btn" aria-label="Restart">↻</button>
    <div id="boss"><span class="name">GRUDGE</span><div class="bar"><div id="boss-fill"></div></div></div>
    <div id="banner"></div>
    <div id="hint" class="desktop-only">Mouse aims (click to lock, Esc to free) · WASD move · click or Space shoot · R reload · E buy on a pad · ` debug</div>
    <div id="crosshair"></div>
    <div id="ammo"><div id="ammo-name">PISTOL</div><div id="ammo-count">10 / ∞</div><div id="reload-bar"><div id="reload-fill"></div></div></div>
    <div id="aim-hint">Click to aim with the mouse</div>
  </div>

  <div id="touch-zone"></div>
  <div id="look-zone"></div>
  <div id="stick-base"><div id="stick-knob"></div></div>
  <button id="attack-btn" aria-label="Fire">FIRE</button>
  <button id="buy-btn" aria-label="Buy">BUY</button>
  <button id="reload-btn" aria-label="Reload">RELOAD</button>

  <div id="end">
    <div class="card">
      <h1 id="end-title">Knocked out</h1>
      <p id="end-sub"></p>
      <button id="end-restart">Play again</button>
    </div>
  </div>

  <div id="debug"></div>
  <script type="module" src="/src/fps/main.js"></script>
</body>
</html>
